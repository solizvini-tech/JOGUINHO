<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Pixel Kingdom Adventure</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#090d16;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:min(1280px,100vw);
    aspect-ratio:16 / 9;
    height:auto;
    max-height:100dvh;
    overflow:hidden;
    background:#000;
    border:4px solid #111;
    box-shadow:0 25px 80px #000;
    touch-action:none;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

#hud{
    position:absolute;
    top:14px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    z-index:5;
    pointer-events:none;
}

.box{
    color:#fff;
    background:rgba(10,16,28,.78);
    border:2px solid rgba(255,255,255,.15);
    padding:9px 15px;
    border-radius:10px;
    font-size:14px;
    text-shadow:2px 2px #000;
}

.box strong{
    font-size:20px;
}

#stageName{
    position:absolute;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    background:#111827cc;
    padding:9px 22px;
    border-radius:20px;
    font-weight:bold;
    opacity:0;
    transition:.4s;
    z-index:8;
}

#message{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:42px;
    font-weight:bold;
    text-align:center;
    text-shadow:4px 4px #000;
    pointer-events:none;
    opacity:0;
    z-index:15;
}

#screen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:30;
}

.panel{
    width:min(540px,90%);
    padding:42px;
    border-radius:20px;
    text-align:center;
    color:#fff;
    background:#111827;
    box-shadow:0 25px 80px #000;
}

.panel h1{
    font-size:40px;
    margin-bottom:18px;
}

.panel p{
    color:#cbd5e1;
    line-height:1.6;
}

button{
    margin-top:25px;
    padding:14px 34px;
    border:0;
    border-radius:10px;
    background:#f5a623;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

#mobile{
    display:none;
    position:absolute;
    bottom:15px;
    left:15px;
    right:15px;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.mobileGroup{
    display:flex;
    gap:10px;
}

.mobileBtn{
    width:60px;
    height:60px;
    border-radius:50%;
    border:2px solid #ffffff44;
    background:#111827aa;
    color:white;
    font-size:24px;
    pointer-events:auto;
    user-select:none;
}

/* =========================================================
   BOTÃO DE ATAQUE
   ---------------------------------------------------------
   Botão visual para atacar; funciona com mouse e toque.
========================================================= */
#attackBtn{
    position:absolute;
    right:25px;
    bottom:25px;
    width:78px;
    height:78px;
    border-radius:50%;
    border:3px solid #ffffff66;
    background:linear-gradient(#ef4444,#991b1b);
    color:#fff;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    z-index:12;
    user-select:none;
    box-shadow:0 6px 18px #0008;
    margin:0;
    transition:transform .08s,filter .08s;
}
#attackBtn:hover{transform:scale(1.06);filter:brightness(1.12);}
#attackBtn:active{transform:scale(.92);filter:brightness(.9);}
#attackBtn.active{transform:scale(.9);filter:brightness(1.25);}

/* =========================================================
   RESPONSIVIDADE PARA CELULAR
   ---------------------------------------------------------
   O jogo mantém a proporção 16:9 para não deformar o cenário.
   Os controles ficam maiores e respeitam a área segura do celular.
========================================================= */
@media (max-width:800px){
    html,body{
        width:100%;
        height:100%;
        overflow:hidden;
        overscroll-behavior:none;
    }

    body{
        min-height:100dvh;
        background:#000;
    }

    #game{
        width:100vw;
        max-width:100vw;
        height:auto;
        max-height:100dvh;
        border:0;
        box-shadow:none;
    }

    #hud{
        top:max(8px,env(safe-area-inset-top));
        left:8px;
        right:8px;
    }

    .box{
        padding:6px 9px;
        border-width:1px;
        border-radius:8px;
        font-size:11px;
    }

    .box strong{
        font-size:15px;
    }

    #stageName{
        top:52px;
        font-size:12px;
        padding:6px 14px;
    }

    #message{
        width:90%;
        font-size:clamp(24px,7vw,42px);
    }

    .panel{
        width:92%;
        max-height:90%;
        overflow:auto;
        padding:24px 18px;
        border-radius:14px;
    }

    .panel h1{
        font-size:clamp(24px,8vw,40px);
        margin-bottom:10px;
    }

    .panel p{
        font-size:14px;
        line-height:1.45;
    }

    #mobile{
        display:flex;
        left:max(10px,env(safe-area-inset-left));
        right:max(10px,env(safe-area-inset-right));
        bottom:max(10px,env(safe-area-inset-bottom));
    }

    .mobileGroup{
        gap:8px;
    }

    .mobileBtn{
        width:clamp(58px,17vw,78px);
        height:clamp(58px,17vw,78px);
        border-width:2px;
        font-size:clamp(22px,7vw,30px);
        margin:0;
        -webkit-tap-highlight-color:transparent;
    }

    #attackBtn{
        width:clamp(64px,19vw,84px);
        height:clamp(64px,19vw,84px);
        right:max(12px,env(safe-area-inset-right));
        bottom:max(12px,env(safe-area-inset-bottom));
        font-size:clamp(24px,7vw,32px);
        border-width:2px;
        -webkit-tap-highlight-color:transparent;
        touch-action:manipulation;
    }

    #controls{
        display:none;
    }
}

/* Celular em pé: avisamos que o jogo foi pensado para jogar melhor deitado. */
@media (max-width:800px) and (orientation:portrait){
    #game{
        width:100vw;
        height:56.25vw;
        max-height:100dvh;
    }

    #screen .panel{
        max-height:88%;
    }
}

/* Celular deitado aproveita praticamente toda a tela. */
@media (max-width:800px) and (orientation:landscape){
    #game{
        width:auto;
        height:100dvh;
        max-width:100vw;
        max-height:100dvh;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas" width="1280" height="720"></canvas>

<div id="hud">

    <div class="box">
        🧑 AVENTUREIRO
        <br>
        ⭐ <strong id="score">0</strong>
        &nbsp;
        🪙 <strong id="coins">0</strong>
        &nbsp;
        ❤️ <strong id="lives">3</strong>
    </div>

    <div class="box">
        🌍 <strong id="worldText">1-1</strong>
        <br>
        📍 <span id="distance">0</span>m
    </div>

</div>

<div id="stageName"></div>
<div id="message"></div>

<div id="mobile">

    <div class="mobileGroup">
        <button class="mobileBtn" id="left">◀</button>
        <button class="mobileBtn" id="right">▶</button>
    </div>

    <button class="mobileBtn" id="jump">⬆</button>

</div>

<!--
    BOTÃO DE ATAQUE:
    ⚔️ representa a espada.
    Clique/toque executa o golpe.
    A tecla X executa o mesmo ataque.
-->
<button id="attackBtn" type="button" aria-label="Atacar">⚔️</button>

<div id="screen">

    <div class="panel">

        <h1>🏰 PIXEL KINGDOM</h1>

        <p>
            Uma aventura de plataforma em quatro mundos.
        </p>

        <p style="margin-top:12px">
            Atravesse florestas, desertos, regiões
            noturnas e finalmente o castelo.
        </p>

        <button onclick="startGame()">
            COMEÇAR
        </button>

    </div>

</div>

</div>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

/* Dimensões internas usadas pelo canvas. */
const W=1280;
const H=720;

/* Gravidade aplicada ao personagem em cada frame. */
const GRAVITY=.72;


/* =========================================================
   ESTADO
========================================================= */

/* Indica se a partida está em andamento. */
let running=false;

/* Indica se o jogador perdeu. */
let gameOver=false;

/* Indica se o jogador venceu os quatro mundos. */
let victory=false;

/* Contador de frames usado nas animações. */
let frame=0;

/* Índice do mundo atual: 0 a 3. */
let world=0;

/* Deslocamento horizontal da câmera. */
let cameraX=0;

/* Pontuação acumulada. */
let score=0;

/* Moedas coletadas. */
let coinsCollected=0;

/* Vidas disponíveis. */
let lives=3;

/* Tamanho horizontal da fase atual. */
let levelLength=7200;

/* Lista de partículas usadas nos efeitos. */
let particles=[];

/* Objetos presentes na fase. */
let platforms=[];       // Plataformas físicas.
let blocks=[];          // Blocos.
let pipes=[];           // Canos.
let coins=[];           // Moedas.
let enemies=[];         // Inimigos.
let decorations=[];    // Árvores e cactos.

/* Objetivo final da fase. */
let goal=null;


/* =========================================================
   CONTROLES
   ---------------------------------------------------------
   "keys" guarda o estado das teclas.
   true  = pressionada
   false = solta
========================================================= */

const keys={}; // Guarda as teclas atualmente pressionadas.

/* Executado quando uma tecla é pressionada. */
window.addEventListener("keydown",e=>{

    keys[e.code]=true;

    /*
        Evita que as teclas de jogo façam o navegador rolar
        a página.
    */
    if([
        "Space",
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight"
    ].includes(e.code)){

        e.preventDefault();

    }

    /*
        X é o ataque.
        "!e.repeat" impede vários ataques enquanto X está segurado.
    */
    if(e.code==="KeyX" && !e.repeat){
        startAttack();
    }

});

/* Executado quando uma tecla é solta. */
window.addEventListener("keyup",e=>{
    keys[e.code]=false;
});

/*
    Conecta um botão da tela a uma tecla virtual.
    Isso permite usar os controles no celular.
*/
function mobileKey(id,code){

    const el=document.getElementById(id);

    /* Ao pressionar o botão, a tecla fica ativa. */
    el.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[code]=true;
    });

    /* Ao soltar, a tecla fica inativa. */
    el.addEventListener("pointerup",e=>{
        e.preventDefault();
        keys[code]=false;
    });

    /* Se o dedo/mouse sair do botão, também liberamos a tecla. */
    el.addEventListener("pointerleave",()=>{
        keys[code]=false;
    });

}

/* Liga os três controles móveis existentes. */
mobileKey("left","ArrowLeft");
mobileKey("right","ArrowRight");
mobileKey("jump","Space");

/* =========================================================
   ATAQUE
   ---------------------------------------------------------
   O jogador pode atacar usando X ou o botão ⚔️.
   O golpe cria uma hitbox na frente do personagem.
   Se um inimigo estiver dentro dela, ele é derrotado.
========================================================= */

/* Busca o botão de ataque criado no HTML. */
const attackButton=document.getElementById("attackBtn");

/* pointerdown funciona com mouse, toque e caneta. */
attackButton.addEventListener("pointerdown",e=>{
    e.preventDefault();
    startAttack();
});

/* Configurações do ataque. */
const attack={
    active:false,       // Indica se o golpe está acontecendo.
    timer:0,            // Frames restantes da animação.
    duration:14,        // Duração do golpe.
    cooldown:0,         // Tempo de espera entre golpes.
    range:72,           // Alcance horizontal da espada.
    damage:1            // Quantidade de dano; inimigos têm 1 vida.
};

/*
    Inicia o ataque se o jogador estiver vivo e sem recarga.
*/
function startAttack(){

    if(!running || !player.alive)
        return;

    if(attack.cooldown>0 || attack.active)
        return;

    attack.active=true;
    attack.timer=attack.duration;

    /* Pequena pausa antes de permitir outro golpe. */
    attack.cooldown=attack.duration+8;

    /* Faz o botão parecer pressionado. */
    attackButton.classList.add("active");

    /* Partículas do início do golpe. */
    createAttackParticles();
}

/*
    Atualiza o ataque a cada frame.
*/
function updateAttack(){

    /* Diminui a recarga até chegar a zero. */
    if(attack.cooldown>0)
        attack.cooldown--;

    if(!attack.active)
        return;

    /*
        Durante esta janela a espada pode acertar.
        O inimigo passa a alive=false após o primeiro acerto,
        evitando que o mesmo inimigo seja contado várias vezes.
    */
    if(attack.timer<=attack.duration && attack.timer>=6){
        checkAttackHits();
    }

    /* Avança a animação. */
    attack.timer--;

    /* Quando termina, desativa o ataque. */
    if(attack.timer<=0){

        attack.active=false;
        attack.timer=0;

        attackButton.classList.remove("active");
    }

}

/*
    Cria uma área invisível na frente do personagem
    e verifica se algum inimigo está dentro dela.
*/
function checkAttackHits(){

    for(const e of enemies){

        /* Inimigos derrotados são ignorados. */
        if(!e.alive)
            continue;

        /*
            Se o personagem olha para a direita, a hitbox fica
            à direita. Se olha para a esquerda, fica à esquerda.
        */
        const hitbox={
            x:
                player.facing===1
                ?player.x+player.w
                :player.x-attack.range,

            y:player.y+8,
            w:attack.range,
            h:player.h-16
        };

        /* Verifica a colisão entre a espada e o inimigo. */
        if(rectHit(hitbox,e)){

            e.alive=false;
            score+=100;

            /* Efeito visual no ponto do acerto. */
            createAttackHitParticles(
                e.x+e.w/2,
                e.y+e.h/2
            );
        }

    }

}

/* Partículas geradas quando o golpe começa. */
function createAttackParticles(){

    for(let i=0;i<6;i++){

        particle(
            player.x+(player.facing===1?player.w:0),
            player.y+28,
            Math.random()*3-1.5,
            Math.random()*-2.5,
            "#ffffff",
            14,
            4
        );

    }

}

/* Partículas geradas quando a espada acerta um inimigo. */
function createAttackHitParticles(x,y){

    for(let i=0;i<18;i++){

        particle(
            x,
            y,
            Math.random()*8-4,
            Math.random()*-7,
            "#ffd43b",
            28,
            5
        );

    }

}


/* =========================================================
   JOGADOR
========================================================= */

const player={

    x:120,
    y:500,

    w:34,
    h:56,

    vx:0,
    vy:0,

    maxSpeed:6.2,

    acceleration:.75,

    friction:.82,

    jumpForce:-14.5,

    grounded:false,

    coyote:0,

    jumpBuffer:0,

    facing:1,

    animation:0,

    invulnerable:0,

    /* Campo reservado para animações do golpe. */
    attackOffset:0,

    alive:true,

    spawnX:120,
    spawnY:500

};


/* =========================================================
   UTILIDADES
========================================================= */

/* Limita um número entre os valores a e b. */
function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

/* Verifica se dois retângulos estão colidindo. */
function rectHit(a,b){

    return(
        a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y
    );

}

/* Calcula a distância entre dois objetos. */
function distance(a,b){
    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


/* =========================================================
   CONFIGURAÇÃO DOS MUNDOS
========================================================= */

const worlds=[

    {
        name:"🌳 Reino Verde",
        sky1:"#52c8f2",
        sky2:"#b9efff",
        ground:"#8b572f",
        grass:"#4cad43",
        mountain:"#65a875",
        night:false,
        desert:false,
        castle:false
    },

    {
        name:"🏜️ Vale do Deserto",
        sky1:"#e98848",
        sky2:"#ffd18d",
        ground:"#b96e35",
        grass:"#d4a64b",
        mountain:"#b77b53",
        night:false,
        desert:true,
        castle:false
    },

    {
        name:"🌙 Floresta Noturna",
        sky1:"#0d1534",
        sky2:"#344b82",
        ground:"#543c38",
        grass:"#3d7052",
        mountain:"#26395e",
        night:true,
        desert:false,
        castle:false
    },

    {
        name:"🏰 Castelo Final",
        sky1:"#150d20",
        sky2:"#48203a",
        ground:"#35212d",
        grass:"#6b2735",
        mountain:"#25152b",
        night:true,
        desert:false,
        castle:true
    }

];


/* =========================================================
   CRIAR FASE
========================================================= */

function createLevel(){

    platforms=[];
    blocks=[];
    pipes=[];
    coins=[];
    enemies=[];
    decorations=[];
    particles=[];

    const cfg=worlds[world];

    levelLength=
        7200+
        world*300;


    /*
       chão
    */

    const gaps=[];

    if(world===0){

        gaps.push(
            [1050,1240],
            [2200,2440],
            [3650,3850],
            [5000,5250]
        );

    }

    if(world===1){

        gaps.push(
            [900,1170],
            [2100,2380],
            [3400,3650],
            [4850,5150]
        );

    }

    if(world===2){

        gaps.push(
            [1200,1420],
            [2550,2800],
            [3900,4150],
            [5250,5550]
        );

    }

    if(world===3){

        gaps.push(
            [850,1080],
            [1900,2200],
            [3150,3400],
            [4500,4800],
            [5700,6000]
        );

    }


    for(
        let x=0;
        x<levelLength;
        x+=200
    ){

        const hole=
            gaps.some(g=>
                x+200>g[0] &&
                x<g[1]
            );

        if(!hole){

            platforms.push({
                x:x,
                y:620,
                w:200,
                h:100
            });

        }

    }


    /*
       plataformas aéreas
    */

    const count=
        25+world*5;

    for(
        let i=0;
        i<count;
        i++
    ){

        const x=
            350+
            i*270+
            Math.random()*70;

        const y=
            400+
            Math.random()*130;

        platforms.push({

            x:x,
            y:y,
            w:120+
                Math.random()*100,
            h:30

        });

    }


    /*
       blocos
    */

    for(
        let i=0;
        i<35;
        i++
    ){

        blocks.push({

            x:
                300+
                i*190+
                Math.random()*70,

            y:
                330+
                Math.random()*180,

            w:40,
            h:40,

            question:
                Math.random()>.6,

            used:false

        });

    }


    /*
       canos
    */

    for(
        let i=0;
        i<18;
        i++
    ){

        pipes.push({

            x:
                650+
                i*380+
                Math.random()*100,

            y:
                470-
                Math.random()*80,

            w:65,

            h:
                150+
                Math.random()*80

        });

    }


    /*
       moedas
    */

    for(
        let i=0;
        i<100;
        i++
    ){

        coins.push({

            x:
                180+
                i*70,

            y:
                350+
                Math.random()*190,

            r:10,

            taken:false,

            spin:Math.random()*Math.PI

        });

    }


    /*
       inimigos
    */

    for(
        let i=0;
        i<25+world*5;
        i++
    ){

        const x=
            600+
            i*260+
            Math.random()*100;

        enemies.push({

            x:x,

            y:575,

            w:38,

            h:45,

            vx:
                -(1.1+
                world*.2),

            startX:x,

            range:100,

            alive:true,

            squish:0

        });

    }


    /*
       árvores / cactos
    */

    for(
        let i=0;
        i<45;
        i++
    ){

        decorations.push({

            x:
                i*180+
                Math.random()*100,

            y:
                500+
                Math.random()*50,

            type:
                cfg.desert
                ?"cactus"
                :"tree"

        });

    }


    /*
       objetivo
    */

    goal={

        x:levelLength-300,

        y:310,

        w:50,

        h:310

    };


    /*
       jogador
    */

    player.x=120;
    player.y=520;

    player.vx=0;
    player.vy=0;

    player.alive=true;

    /* Toda fase nova começa com o ataque zerado. */
    attack.active=false;
    attack.timer=0;
    attack.cooldown=0;
    attackButton.classList.remove("active");

    player.invulnerable=0;

    player.spawnX=120;
    player.spawnY=520;

    cameraX=0;

    document.getElementById(
        "worldText"
    ).textContent=
        `${world+1}-1`;

    showStageName(
        cfg.name
    );

}


/* =========================================================
   PULOS
========================================================= */

function tryJump(){

    if(
        player.alive &&
        (
            player.grounded ||
            player.coyote>0
        )
    ){

        player.vy=
            player.jumpForce;

        player.grounded=false;

        player.coyote=0;

        createJumpParticles();

    }

}


/* =========================================================
   FÍSICA
========================================================= */

function updatePlayer(){

    if(!player.alive)
        return;


    /*
       horizontal
    */

    const left=
        keys.ArrowLeft ||
        keys.KeyA;

    const right=
        keys.ArrowRight ||
        keys.KeyD;


    if(right){

        player.vx+=
            player.acceleration;

        player.facing=1;

    }else if(left){

        player.vx-=
            player.acceleration;

        player.facing=-1;

    }else{

        player.vx*=
            player.friction;

    }


    player.vx=
        clamp(
            player.vx,
            -player.maxSpeed,
            player.maxSpeed
        );


    /*
       jump buffer
    */

    if(
        keys.Space ||
        keys.ArrowUp ||
        keys.KeyW
    ){

        player.jumpBuffer=8;

    }


    if(player.jumpBuffer>0){

        tryJump();

        player.jumpBuffer--;

    }


    /*
       gravidade
    */

    player.vy+=GRAVITY;

    /*
       pulo variável
    */

    if(
        player.vy<0 &&
        !(
            keys.Space ||
            keys.ArrowUp ||
            keys.KeyW
        )
    ){

        player.vy+=.42;

    }


    player.x+=player.vx;

    player.y+=player.vy;


    /*
       limites
    */

    if(player.x<0)
        player.x=0;


    /*
       colisões
    */

    const oldBottom=
        player.y+
        player.h-
        player.vy;


    player.grounded=false;


    for(const p of platforms){

        if(

            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h>=p.y &&
            oldBottom<=p.y

        ){

            player.y=
                p.y-player.h;

            player.vy=0;

            player.grounded=true;

        }

    }


    /*
       blocos
    */

    for(const b of blocks){

        if(!rectHit(player,b))
            continue;


        if(
            player.vy>0 &&
            oldBottom<=b.y
        ){

            player.y=
                b.y-player.h;

            player.vy=0;

            player.grounded=true;

        }

        else if(
            player.vy<0 &&
            player.y>b.y
        ){

            player.y=
                b.y+b.h;

            player.vy=0;

            if(
                b.question &&
                !b.used
            ){

                b.used=true;

                score+=50;

                createCoinBurst(
                    b.x+20,
                    b.y
                );

            }

        }

    }


    /*
       canos
    */

    for(const p of pipes){

        if(!rectHit(player,p))
            continue;


        if(
            player.vy>0 &&
            oldBottom<=p.y
        ){

            player.y=
                p.y-player.h;

            player.vy=0;

            player.grounded=true;

        }else{

            if(
                player.x+
                player.w/2<
                p.x+
                p.w/2
            ){

                player.x=
                    p.x-player.w;

            }else{

                player.x=
                    p.x+p.w;

            }

            player.vx=0;

        }

    }


    /*
       coyote time
    */

    if(player.grounded){

        player.coyote=7;

    }else if(player.coyote>0){

        player.coyote--;

    }


    /*
       caiu
    */

    if(player.y>760){

        loseLife();

    }


    if(player.invulnerable>0)
        player.invulnerable--;

}

/* =========================================================
   INIMIGOS
========================================================= */

function updateEnemies(){

    /*
        Atualiza o movimento dos inimigos e a colisão deles
        com o jogador. O ataque já foi processado antes desta função.
    */
    for(const e of enemies){

        if(!e.alive)
            continue;


        e.x+=e.vx;


        if(
            Math.abs(
                e.x-e.startX
            )>e.range
        ){

            e.vx*=-1;

        }


        if(
            player.alive &&
            rectHit(player,e)
        ){

            const stomp=
                player.vy>0 &&
                player.y+
                player.h<
                e.y+25;


            if(stomp){

                e.alive=false;

                player.vy=-10;

                score+=100;

                createCoinBurst(
                    e.x+20,
                    e.y
                );

            }else{

                hurtPlayer();

            }

        }

    }

}


/* =========================================================
   DANO
========================================================= */

function hurtPlayer(){

    if(
        player.invulnerable>0 ||
        !player.alive
    )
        return;


    lives--;

    player.invulnerable=100;

    player.vy=-10;

    player.vx=
        -player.facing*4;


    createHitParticles(
        player.x+17,
        player.y+25
    );


    if(lives<=0){

        player.alive=false;

        setTimeout(
            showGameOver,
            600
        );

    }

}


/* =========================================================
   VIDA
========================================================= */

function loseLife(){

    if(!player.alive)
        return;


    lives--;

    if(lives<=0){

        player.alive=false;

        showGameOver();

        return;

    }


    player.x=
        player.spawnX;

    player.y=
        player.spawnY;

    player.vx=0;

    player.vy=-10;

    player.invulnerable=120;

    cameraX=0;

    showMessage(
        "❤️ VIDA PERDIDA"
    );

}


/* =========================================================
   MOEDAS
========================================================= */

function updateCoins(){

    for(const c of coins){

        if(c.taken)
            continue;


        c.spin+=.12;


        const box={

            x:c.x-12,

            y:c.y-12,

            w:24,

            h:24

        };


        if(rectHit(player,box)){

            c.taken=true;

            coinsCollected++;

            score+=25;

            createCoinBurst(
                c.x,
                c.y
            );

        }

    }

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function particle(x,y,vx,vy,color,life=30,size=5){

    particles.push({

        x:x,
        y:y,

        vx:vx,
        vy:vy,

        color:color,

        life:life,

        maxLife:life,

        size:size

    });

}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.25;

        p.life--;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


function drawParticles(){

    for(const p of particles){

        const x=
            p.x-cameraX;

        ctx.globalAlpha=
            p.life/p.maxLife;

        ctx.fillStyle=p.color;

        ctx.fillRect(
            x,
            p.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha=1;

}


function createJumpParticles(){

    for(let i=0;i<7;i++){

        particle(
            player.x+17,
            player.y+55,
            Math.random()*3-1.5,
            Math.random()*-2,
            "#ffffffaa",
            20,
            4
        );

    }

}


function createCoinBurst(x,y){

    for(let i=0;i<12;i++){

        particle(
            x,
            y,
            Math.random()*5-2.5,
            Math.random()*-5-1,
            "#ffd83d",
            35,
            5
        );

    }

}


function createHitParticles(x,y){

    for(let i=0;i<15;i++){

        particle(
            x,
            y,
            Math.random()*7-3.5,
            Math.random()*-6,
            "#ff5a3d",
            30,
            5
        );

    }

}


/* =========================================================
   CÉU
========================================================= */

function drawSky(){

    const cfg=worlds[world];

    const g=
        ctx.createLinearGradient(
            0,0,0,H
        );

    g.addColorStop(
        0,
        cfg.sky1
    );

    g.addColorStop(
        1,
        cfg.sky2
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,0,W,H
    );


    /*
       estrelas
    */

    if(cfg.night){

        ctx.fillStyle="#ffffffaa";

        for(
            let i=0;
            i<100;
            i++
        ){

            const x=
                (i*173-
                cameraX*.1)%W;

            const y=
                50+
                (i*71)%280;

            ctx.fillRect(
                x,
                y,
                2,
                2
            );

        }

        /*
           lua
        */

        ctx.fillStyle="#fff3c4";

        ctx.beginPath();

        ctx.arc(
            1030,
            110,
            50,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else{

        ctx.fillStyle="#ffe27a";

        ctx.beginPath();

        ctx.arc(
            1040,
            110,
            55,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   NUVENS
========================================================= */

function drawClouds(){

    if(world===3)
        return;


    for(
        let i=-3;
        i<20;
        i++
    ){

        const x=
            i*430-
            cameraX*.22;

        const y=
            90+
            (i%4)*65;

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+35,
            y-15,
            40,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+75,
            y,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   MONTANHAS
========================================================= */

function drawMountains(){

    const cfg=worlds[world];

    ctx.fillStyle=cfg.mountain;


    for(
        let i=-4;
        i<30;
        i++
    ){

        const x=
            i*360-
            cameraX*.4;

        ctx.beginPath();

        ctx.moveTo(
            x,
            620
        );

        ctx.lineTo(
            x+180,
            320
        );

        ctx.lineTo(
            x+360,
            620
        );

        ctx.fill();

    }

}


/* =========================================================
   DECORAÇÕES
========================================================= */

function drawDecorations(){

    const cfg=worlds[world];

    for(const d of decorations){

        const x=
            d.x-cameraX*.8;

        if(x<-100 || x>W+100)
            continue;


        if(d.type==="cactus"){

            ctx.fillStyle="#3d7e42";

            ctx.fillRect(
                x,
                d.y,
                20,
                100
            );

            ctx.fillRect(
                x-18,
                d.y+30,
                18,
                12
            );

            ctx.fillRect(
                x+20,
                d.y+50,
                18,
                12
            );

        }else{

            ctx.fillStyle="#70472b";

            ctx.fillRect(
                x+22,
                d.y,
                18,
                100
            );

            ctx.fillStyle="#277d43";

            ctx.beginPath();

            ctx.arc(
                x+30,
                d.y,
                40,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.beginPath();

            ctx.arc(
                x,
                d.y+25,
                27,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }

}


/* =========================================================
   PLATAFORMAS
========================================================= */

function drawPlatforms(){

    const cfg=worlds[world];

    for(const p of platforms){

        const x=
            p.x-cameraX;

        if(
            x+p.w<0 ||
            x>W
        )
            continue;


        ctx.fillStyle=
            cfg.grass;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            12
        );


        ctx.fillStyle=
            cfg.ground;

        ctx.fillRect(
            x,
            p.y+12,
            p.w,
            p.h-12
        );


        /*
           textura
        */

        ctx.fillStyle="#00000022";

        for(
            let tx=x;
            tx<x+p.w;
            tx+=28
        ){

            ctx.fillRect(
                tx,
                p.y+30,
                5,
                10
            );

        }

    }

}


/* =========================================================
   BLOCOS
========================================================= */

function drawBlocks(){

    for(const b of blocks){

        const x=
            b.x-cameraX;

        if(x<-50 || x>W+50)
            continue;


        ctx.fillStyle=
            b.question &&
            !b.used
            ?"#f5b72c"
            :"#95502f";


        ctx.fillRect(
            x,
            b.y,
            b.w,
            b.h
        );


        ctx.strokeStyle="#532d20";

        ctx.lineWidth=3;

        ctx.strokeRect(
            x,
            b.y,
            b.w,
            b.h
        );


        if(
            b.question &&
            !b.used
        ){

            ctx.fillStyle="#fff";

            ctx.font=
                "bold 26px Arial";

            ctx.textAlign="center";

            ctx.fillText(
                "?",
                x+20,
                b.y+29
            );

        }

    }

}


/* =========================================================
   CANOS
========================================================= */

function drawPipes(){

    for(const p of pipes){

        const x=
            p.x-cameraX;

        if(x<-100 || x>W+100)
            continue;


        const color=
            world===3
            ?"#772d42"
            :"#30963c";

        const light=
            world===3
            ?"#a13c56"
            :"#4cc957";


        ctx.fillStyle=color;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );


        ctx.fillStyle=light;

        ctx.fillRect(
            x-7,
            p.y,
            p.w+14,
            18
        );

    }

}


/* =========================================================
   MOEDAS
========================================================= */

function drawCoins(){

    for(const c of coins){

        if(c.taken)
            continue;


        const x=
            c.x-cameraX;


        const width=
            Math.abs(
                Math.cos(c.spin)
            )*9+3;


        ctx.fillStyle="#ffd43b";

        ctx.beginPath();

        ctx.ellipse(
            x,
            c.y,
            width,
            c.r,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle="#d69200";

        ctx.stroke();

    }

}


/* =========================================================
   INIMIGOS
========================================================= */

function drawEnemies(){

    /*
       DESENHO DOS INIMIGOS
       --------------------
       Aqui usamos a FOTO REAL enviada pelo usuário como o
       corpo visual de cada inimigo.

       A foto é desenhada inteira dentro do espaço do inimigo.
       Por isso ela fica propositalmente "espremida"/deformada
       quando o jogo reduz a foto para o tamanho do inimigo.
       Você pediu para usar a foto exatamente assim, mesmo que
       fique feio, então NÃO fazemos recorte do rosto.
    */
    for(const e of enemies){

        if(!e.alive)
            continue;

        /* Converte coordenada do mundo para coordenada da tela. */
        const x=e.x-cameraX;

        if(enemySprite.complete && enemySprite.naturalWidth>0){

            /*
               Desenhamos a FOTO INTEIRA no lugar do inimigo.
               O tamanho visual acompanha o inimigo, então a
               colisão continua funcionando exatamente como antes.
            */
            ctx.imageSmoothingEnabled=true;
            ctx.drawImage(
                enemySprite,
                Math.round(x-6),
                Math.round(e.y-5),
                50,
                65
            );
        }

    }

}

/* =========================================================
   CASTELO
========================================================= */

function drawCastle(){

    if(world!==3)
        return;


    const x=
        goal.x-cameraX;


    ctx.fillStyle="#191522";

    ctx.fillRect(
        x-100,
        350,
        300,
        270
    );


    ctx.fillRect(
        x-140,
        280,
        90,
        340
    );


    ctx.fillRect(
        x+170,
        280,
        90,
        340
    );


    ctx.fillStyle="#2a2333";

    ctx.fillRect(
        x-155,
        250,
        120,
        35
    );

    ctx.fillRect(
        x+155,
        250,
        120,
        35
    );


    /*
       porta
    */

    ctx.fillStyle="#08090d";

    ctx.fillRect(
        x+50,
        480,
        80,
        140
    );


    /*
       janelas
    */

    ctx.fillStyle="#ffbd3d";

    for(let i=0;i<4;i++){

        ctx.fillRect(
            x-65+i*85,
            400,
            24,
            38
        );

    }

}


/* =========================================================
   BANDEIRA / OBJETIVO
========================================================= */

function drawGoal(){

    const x=
        goal.x-cameraX;


    ctx.fillStyle="#25232c";

    ctx.fillRect(
        x,
        goal.y,
        8,
        goal.h
    );


    ctx.fillStyle=
        world===3
        ?"#e83c4b"
        :"#ffe34a";


    ctx.beginPath();

    ctx.moveTo(
        x+8,
        goal.y
    );

    ctx.lineTo(
        x+85,
        goal.y+30
    );

    ctx.lineTo(
        x+8,
        goal.y+60
    );

    ctx.fill();

}


/* =========================================================
   PERSONAGEM
========================================================= */

function drawPlayer(){

    if(!player.alive)
        return;


    /*
       piscar após dano
    */

    if(
        player.invulnerable>0 &&
        Math.floor(
            player.invulnerable/5
        )%2===0
    )
        return;


    const x=
        player.x-cameraX;

    const y=player.y;


    /*
       sombra
    */

    ctx.fillStyle="#0006";

    ctx.beginPath();

    ctx.ellipse(
        x+17,
        y+58,
        24,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       animação
    */

    const walking=
        Math.abs(player.vx)>.5 &&
        player.grounded;

    const leg=
        walking
        ?Math.sin(frame*.35)*4
        :0;


    /*
       pernas
    */

    ctx.fillStyle="#202c3d";

    ctx.fillRect(
        x+5,
        y+39,
        10,
        18+leg
    );

    ctx.fillRect(
        x+20,
        y+39,
        10,
        18-leg
    );


    /*
       botas
    */

    ctx.fillStyle="#292019";

    ctx.fillRect(
        x+1,
        y+52+leg,
        15,
        7
    );

    ctx.fillRect(
        x+19,
        y+52-leg,
        15,
        7
    );


    /*
       corpo
    */

    ctx.fillStyle="#287be7";

    ctx.fillRect(
        x+4,
        y+20,
        27,
        27
    );


    /*
       braços
    */

    ctx.fillStyle="#f1a775";

    ctx.fillRect(
        x-3,
        y+24,
        8,
        21
    );

    ctx.fillRect(
        x+29,
        y+24,
        8,
        21
    );


    /*
       cabeça
    */

    ctx.fillStyle="#f4b184";

    ctx.beginPath();

    ctx.arc(
        x+17,
        y+14,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       cabelo
    */

    ctx.fillStyle="#542e22";

    ctx.fillRect(
        x+4,
        y+1,
        26,
        9
    );


    /*
       chapéu
    */

    ctx.fillStyle="#2465c5";

    ctx.fillRect(
        x,
        y+3,
        34,
        9
    );

    ctx.fillRect(
        x-4,
        y+10,
        40,
        5
    );


    /*
       olhos
    */

    ctx.fillStyle="#111";

    if(player.facing===1){

        ctx.fillRect(
            x+21,
            y+13,
            4,
            6
        );

    }else{

        ctx.fillRect(
            x+9,
            y+13,
            4,
            6
        );

    }


    /*
       rosto
    */

    ctx.fillStyle="#b86e55";

    ctx.fillRect(
        x+12,
        y+22,
        10,
        4
    );

    /*
        =========================================================
        ESPADA / GOLPE
        =========================================================
        A espada aparece somente enquanto attack.active é true.
        player.facing define a direção do golpe.
    */
    if(attack.active){

        const direction=player.facing;

        /* Progresso da animação entre 0 e 1. */
        const progress=1-(attack.timer/attack.duration);

        /* Ângulo usado para fazer a espada girar. */
        const angle=direction*(-0.9+progress*1.8);

        /* Ponto da mão onde a espada é segurada. */
        const handX=x+17+direction*12;
        const handY=y+30;

        ctx.save();

        /* Faz a espada girar em torno da mão. */
        ctx.translate(handX,handY);
        ctx.rotate(angle);

        /* Cabo da espada. */
        ctx.fillStyle="#5b351e";
        ctx.fillRect(0,-3,15,6);

        /* Lâmina. */
        ctx.fillStyle="#e5e7eb";
        ctx.beginPath();
        ctx.moveTo(12,-5);
        ctx.lineTo(55,-3);
        ctx.lineTo(62,0);
        ctx.lineTo(55,3);
        ctx.lineTo(12,5);
        ctx.closePath();
        ctx.fill();

        /* Brilho da lâmina. */
        ctx.fillStyle="#ffffff";
        ctx.fillRect(20,-2,32,2);

        /* Guarda da espada. */
        ctx.fillStyle="#f5b72c";
        ctx.fillRect(10,-8,5,16);

        ctx.restore();

        /* Arco visual indicando a região atingida. */
        ctx.save();
        ctx.strokeStyle="#ffffffaa";
        ctx.lineWidth=5;
        ctx.beginPath();

        const arcCenterX=x+17+direction*8;
        const arcCenterY=y+30;

        ctx.arc(
            arcCenterX,
            arcCenterY,
            52,
            direction===1?-0.95:Math.PI+0.95,
            direction===1?0.95:Math.PI-0.95
        );

        ctx.stroke();
        ctx.restore();
    }

}


/* =========================================================
   PARTÍCULAS DE LAVA
========================================================= */

function drawLava(){

    if(world!==3)
        return;


    for(
        let x=0;
        x<levelLength;
        x+=100
    ){

        const sx=
            x-cameraX;

        ctx.fillStyle="#e7432e";

        ctx.beginPath();

        ctx.arc(
            sx,
            675,
            25+
                Math.sin(
                    frame*.08+x
                )*5,
            Math.PI,
            0
        );

        ctx.fill();

    }

}


/* =========================================================
   DESENHO COMPLETO
========================================================= */

function draw(){

    drawSky();

    drawClouds();

    drawMountains();

    drawDecorations();

    drawLava();

    drawPlatforms();

    drawBlocks();

    drawPipes();

    drawCoins();

    drawEnemies();

    drawCastle();

    drawGoal();

    drawPlayer();

    drawParticles();

}


/* =========================================================
   CÂMERA
========================================================= */

function updateCamera(){

    const target=
        player.x-360;

    cameraX+=
        (target-cameraX)*.08;


    cameraX=
        clamp(
            cameraX,
            0,
            levelLength-W
        );

}


/* =========================================================
   FINAL DE FASE
========================================================= */

function checkGoal(){

    if(
        player.alive &&
        player.x+player.w>
        goal.x
    ){

        running=false;

        score+=1000;

        showMessage(
            world===3
            ?"🏆 CASTELO CONCLUÍDO!"
            :"🏁 FASE CONCLUÍDA!"
        );


        setTimeout(()=>{

            if(world<3){

                world++;

                running=true;

                createLevel();

            }else{

                showVictory();

            }

        },1800);

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(){

    running=false;

    gameOver=true;

    document.getElementById(
        "screen"
    ).style.display="flex";


    document.querySelector(
        ".panel"
    ).innerHTML=`

        <h1>💀 GAME OVER</h1>

        <p>
            A aventura terminou.
        </p>

        <p style="margin-top:15px">
            Pontuação:
            <strong>${score}</strong>
        </p>

        <p>
            Moedas:
            <strong>${coinsCollected}</strong>
        </p>

        <button onclick="restartGame()">
            TENTAR NOVAMENTE
        </button>

    `;

}


/* =========================================================
   VITÓRIA
========================================================= */

function showVictory(){

    running=false;

    victory=true;

    document.getElementById(
        "screen"
    ).style.display="flex";


    document.querySelector(
        ".panel"
    ).innerHTML=`

        <h1>👑 VITÓRIA!</h1>

        <p>
            Você atravessou todos os quatro mundos
            e chegou ao castelo final.
        </p>

        <p style="margin-top:15px">
            ⭐ Pontuação:
            <strong>${score}</strong>
        </p>

        <p>
            🪙 Moedas:
            <strong>${coinsCollected}</strong>
        </p>

        <p style="margin-top:15px">
            🌳 Reino Verde ✓<br>
            🏜️ Deserto ✓<br>
            🌙 Noite ✓<br>
            🏰 Castelo ✓
        </p>

        <button onclick="location.reload()">
            NOVA AVENTURA
        </button>

    `;

}


/* =========================================================
   MENSAGENS
========================================================= */

let messageTimer;

function showMessage(text){

    const el=
        document.getElementById(
            "message"
        );

    el.textContent=text;

    el.style.opacity=1;

    clearTimeout(messageTimer);

    messageTimer=
        setTimeout(()=>{

            el.style.opacity=0;

        },1300);

}


let stageTimer;

function showStageName(text){

    const el=
        document.getElementById(
            "stageName"
        );

    el.textContent=text;

    el.style.opacity=1;

    clearTimeout(stageTimer);

    stageTimer=
        setTimeout(()=>{

            el.style.opacity=0;

        },2200);

}


/* =========================================================
   INÍCIO
========================================================= */

function startGame(){

    document.getElementById(
        "screen"
    ).style.display="none";

    world=0;

    score=0;

    coinsCollected=0;

    lives=3;

    frame=0;

    gameOver=false;

    victory=false;

    createLevel();

    running=true;

}


/* =========================================================
   REINICIAR
========================================================= */

function restartGame(){

    document.getElementById(
        "screen"
    ).style.display="none";

    world=0;

    score=0;

    coinsCollected=0;

    lives=3;

    frame=0;

    gameOver=false;

    victory=false;

    createLevel();

    running=true;

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(!running)
        return;


    frame++;


    updatePlayer();

    /* Atualiza o golpe antes das colisões com os inimigos. */
    updateAttack();

    updateEnemies();

    updateCoins();

    updateParticles();

    updateCamera();

    checkGoal();


    document.getElementById(
        "score"
    ).textContent=score;

    document.getElementById(
        "coins"
    ).textContent=coinsCollected;

    document.getElementById(
        "lives"
    ).textContent=lives;

    document.getElementById(
        "distance"
    ).textContent=
        Math.floor(
            player.x/10
        );

}


/* =========================================================
   LOOP
========================================================= */

function loop(){

    /*
        UPDATE calcula a lógica do jogo:
        física, jogador, ataque, inimigos, moedas e câmera.

        DRAW desenha todos os elementos no canvas.

        requestAnimationFrame agenda o próximo frame.
    */
    update();
    draw();

    requestAnimationFrame(loop);

}


createLevel();

loop();

</script>
